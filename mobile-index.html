<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE KING OF SPADES - 3rd Annual Tournament</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/homepage.css">
    <link rel="stylesheet" href="css/mobile-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <a href="register.html" class="logo-link">
                    <div class="logo-image-container">
                        <img src="images/2025-10-06_13-03-27.png" alt="Spades Logo" class="logo-image">
                    </div>
                </a>
                <div class="logo-text-container">
                    <span class="logo-text">KING OF SPADES</span>
                </div>
            </div>
            <ul class="nav-menu">
                <li><a href="register.html" class="nav-link">Register</a></li>
                <li><a href="players.html" class="nav-link">Players</a></li>
            </ul>
            <div class="nav-toggle">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <h1 class="hero-title">THE KING OF SPADES</h1>
            <p class="hero-subtitle">3rd Annual Tournament</p>
            <div class="hero-cta">
                <a href="register.html" class="cta-button">Register Your Team</a>
                <a href="players.html" class="cta-button secondary">View Players</a>
            </div>
        </div>
    </section>

    <!-- Tournament Flyer Section -->
    <section id="flyer" class="flyer-section">
        <div class="container">
            <div class="flyer-container fade-in">
                <img src="images/3rd-Annual-Spades-Tournament.png" 
                     alt="THE KING OF SPADES Tournament Flyer" 
                     class="tournament-flyer-image"
                     loading="eager"
                     decoding="async"
                     crossorigin="anonymous">
                <div class="flyer-overlay">
                    <div class="flyer-actions">
                        <button class="share-btn" onclick="shareOnInstagram()">
                            Share on Instagram
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Contact Information Section -->
    <section class="contact-section">
        <div class="container">
            <h2 class="section-title fade-in">Contact Information</h2>
            <div class="contact-info">
                <div class="contact-item fade-in">
                    <h4>📞 Phone</h4>
                    <p>209-993-2099</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 The King of Spades Tournament. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/homepage.js"></script>
    <script src="js/mobile.js"></script>
</body>
</html>
